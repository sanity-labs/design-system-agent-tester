# Runs unit tests only; the full agent loop requires an API key and is not exercised in CI.
name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Auto-pick the latest 22 LTS. Pinning to a specific patch
          # (e.g. 22.11.0) breaks when native-binding optional deps
          # bump their engine floor — rolldown 1.x already requires
          # >=22.12.0, and that floor will keep moving.
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm test
